<!DOCTYPE html>

    <header>
        <img src="https://file.garden/akViTgt553ws6yVh/Untitled_Artwork%20100.png" alt="header image" width="2000">

    <head>
        <meta charset="utf-8" />
        <title>sidequest maxxing</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
       
        <main>
            <section class="card">
                <h2>20+ sidequest ideas at your fingertips (๑>ᴗ<๑) </h2>
                <h5>instead of doomscrolling, do a sidequest!</h5>
                <h3>click the button to generate a perfect day!</h3>
                   <button id="solo">solo</button>
                      <button id="friends">with friends</button>

            <section class="quest">
        
              <img id="randomsolo-img" src=" alt="solo image">

              <script>
                const soloImageArray = [
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/bear.",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/bunny%20magic",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/frog",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/polarbear",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/rabbit",
            
                ];
                const soloImgElement = document.getElementById("randomsolo-img");
                const soloBtnElement = document.getElementById("solo");

                function showRandomSoloImage() {
                  const randomIndex = Math.floor(Math.random() * soloImageArray.length);
                  soloImgElement.src = soloImageArray[randomIndex];
                }

                soloBtnElement.addEventListener("click", showRandomSoloImage);
              </script>

              <img id="randomfriends-img" src=" alt="friends image">

              <script>
                const friendsImageArray = [
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/seals",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/penguin",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/monkeys",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/fih",
                  "https://file.garden/akViTgt553ws6yVh/sunbeam/bird",
                  
                ];        
                const friendsImgElement = document.getElementById("randomfriends-img");
                const friendsBtnElement = document.getElementById("friends");

                function showRandomFriendsImage() {
                  const randomIndex = Math.floor(Math.random() * friendsImageArray.length);
                  friendsImgElement.src = friendsImageArray[randomIndex];
                }

                friendsBtnElement.addEventListener("click", showRandomFriendsImage);
              </script>
            </section>

  <section >
           
    </section>
